openapi: 3.0.3
info:
  title: Web Studio IMG API
  version: 1.0.0
  description: REST API for private Web Studio IMG projects and creative workflows.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      summary: API health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: web-studio-img-api}
  /projects:
    get:
      operationId: listProjects
      summary: List projects owned by the authenticated user
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Get an owned project
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateProject
      summary: Update an owned project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveProject
      summary: Archive an owned project
      responses:
        '200':
          description: Archived project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/iterations:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listProjectIterations
      summary: List immutable creative iterations
      responses:
        '200':
          description: Iteration timeline
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IterationList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createIteration
      summary: Create an immutable iteration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IterationInput'}
      responses:
        '201':
          description: Iteration created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/iterations/{iteration_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: iteration_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getIteration
      summary: Get an immutable iteration
      responses:
        '200':
          description: Iteration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/iterations/{iteration_id}/restore:
    post:
      operationId: restoreIteration
      summary: Restore an iteration by creating a new child iteration
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: iteration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201':
          description: Restored iteration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/generations:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createGeneration
      summary: Queue an asynchronous image generation
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerationInput'}
      responses:
        '202':
          description: Generation queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '200':
          description: Existing idempotent generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/generations/{generation_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: generation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getGeneration
      summary: Get generation status and provenance parameters
      responses:
        '200':
          description: Generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/generations/{generation_id}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel a queued or running generation
      responses:
        '200':
          description: Cancelled generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/generations/{generation_id}/events:
    get:
      operationId: streamGenerationEvents
      summary: Stream generation status over SSE
      responses:
        '200':
          description: Server-sent generation status events
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Iteration:
      type: object
      required: [id, project_id, type, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        parent_iteration_id: {type: string, format: uuid}
        type: {type: string, enum: [idea, sketch, generation, selection, composition, prompt, manual_edit, final]}
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 5000}
        created_at: {type: string, format: date-time}
    IterationInput:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        parent_iteration_id: {type: string, format: uuid}
        type: {type: string, enum: [idea, sketch, generation, selection, composition, prompt, manual_edit, final]}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
    IterationList:
      type: object
      required: [iterations]
      properties:
        iterations:
          type: array
          items: {$ref: '#/components/schemas/Iteration'}
    Project:
      type: object
      required: [id, user_id, name, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string}
        status: {type: string, enum: [active, archived, deleted]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProjectInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
    ProjectUpdate:
      type: object
      required: [name, status]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        status: {type: string, enum: [active, archived, deleted]}
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    Generation:
      type: object
      required: [id, project_id, user_id, provider, model, prompt, status, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        iteration_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        provider: {type: string}
        model: {type: string}
        model_version: {type: string}
        prompt: {type: string}
        negative_prompt: {type: string}
        seed: {type: integer, format: int64}
        aspect_ratio: {type: string}
        parameters: {type: object, additionalProperties: true}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        provider_job_id: {type: string}
        error_code: {type: string}
        error_message: {type: string}
        cost: {type: number, format: double}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    GenerationInput:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        iteration_id: {type: string, format: uuid}
        prompt: {type: string, minLength: 1, maxLength: 20000}
        negative_prompt: {type: string, maxLength: 10000}
        seed: {type: integer, format: int64}
        aspect_ratio: {type: string, pattern: '^[0-9]+:[0-9]+      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
}
        parameters: {type: object, additionalProperties: true}

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
