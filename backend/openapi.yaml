openapi: 3.0.3
info:
  title: Web Studio IMG API
  version: 1.0.0
  description: Foundation REST API contract.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: API health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: web-studio-img-api}
  /projects:
    get:
      summary: Projects endpoint placeholder
      responses:
        '501':
          description: Project API is implemented in the projects phase.
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
