services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://webstudio:webstudio@postgres:5432/webstudio?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ru-central1
      S3_BUCKET: web-studio
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: miniosecret
      S3_PATH_STYLE: "true"
      YANDEXART_API_KEY: ${YANDEXART_API_KEY:-}
      YANDEXART_FOLDER_ID: ${YANDEXART_FOLDER_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://webstudio:webstudio@postgres:5432/webstudio?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ru-central1
      S3_BUCKET: web-studio
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: miniosecret
      S3_PATH_STYLE: "true"
      YANDEXART_API_KEY: ${YANDEXART_API_KEY:-}
      YANDEXART_FOLDER_ID: ${YANDEXART_FOLDER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webstudio
      POSTGRES_USER: webstudio
      POSTGRES_PASSWORD: webstudio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webstudio -d webstudio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
